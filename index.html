<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Guesser Experiment</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="logic.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1 id="title">Card guesser experiment</h1>
        </header>
        <main>
            <section id="play">
                <h2>Play</h2>
                <input id="guess" list="card-names" placeholder="e.g. Ace of Spades" autocomplete="off">
                <datalist id="card-names"></datalist>
            </section>

            <div class="separator">OR</div>

            <section id="simulate">
                <h2>Simulate</h2>
            </section>
        </main>
    </div>
</body>

</html>
